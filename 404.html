<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Ueda Odontologia Integrada</title>
  <script type="text/javascript">
    // GitHub Pages Single Page App redirect fix for subfolders
    var pathSegmentsToKeep = 1;
    var l = window.location;
    var pathname = l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/');
    var search = l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '';
    var hash = l.hash;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      pathname + '/?p=/' +
      l.pathname.slice(pathname.length).split('/').filter(Boolean).join('/') +
      search + hash
    );
  </script>
</head>
<body>
</body>
</html>
